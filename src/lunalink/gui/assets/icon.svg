<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- LunaLink ADCS Simulator application icon -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </radialGradient>
    <radialGradient id="earth" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#7fb3ff"/>
      <stop offset="55%" stop-color="#2e6fd0"/>
      <stop offset="100%" stop-color="#123063"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#d9dde3"/>
      <stop offset="100%" stop-color="#8b929c"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none"
        stroke="#46a0ff" stroke-opacity="0.35" stroke-width="4"/>

  <!-- star field -->
  <g fill="#cdd8ea">
    <circle cx="52" cy="52" r="2.2"/>
    <circle cx="204" cy="44" r="1.6"/>
    <circle cx="228" cy="118" r="2.0"/>
    <circle cx="40" cy="160" r="1.5"/>
    <circle cx="186" cy="206" r="1.8"/>
    <circle cx="86" cy="34" r="1.4"/>
  </g>

  <!-- Molniya-type elliptical orbit -->
  <ellipse cx="128" cy="128" rx="96" ry="58" fill="none"
           stroke="#46a0ff" stroke-width="4" stroke-opacity="0.85"
           stroke-dasharray="1 9" stroke-linecap="round"
           transform="rotate(-24 128 128)"/>

  <!-- Earth (at a focus) -->
  <circle cx="103" cy="140" r="42" fill="url(#earth)"/>
  <path d="M78 128 q14 -12 30 -6 q16 6 28 -2" fill="none"
        stroke="#9fd08f" stroke-opacity="0.8" stroke-width="6" stroke-linecap="round"/>
  <path d="M84 156 q12 8 26 4" fill="none"
        stroke="#9fd08f" stroke-opacity="0.65" stroke-width="5" stroke-linecap="round"/>

  <!-- Moon -->
  <circle cx="216" cy="70" r="15" fill="url(#moon)"/>
  <circle cx="211" cy="66" r="3.4" fill="#767d87"/>
  <circle cx="221" cy="75" r="2.4" fill="#767d87"/>

  <!-- relay link Earth-satellite-Moon -->
  <g stroke-linecap="round">
    <path d="M120 108 L163 87" stroke="#5fd0a5" stroke-width="3.2" stroke-dasharray="2 7"/>
    <path d="M176 82 L203 74" stroke="#ffd24d" stroke-width="3.2" stroke-dasharray="2 7"/>
  </g>

  <!-- LunaLink satellite: body + solar wings -->
  <g transform="rotate(-24 170 84)">
    <rect x="146" y="78" width="17" height="12" rx="2.5" fill="#46a0ff"/>
    <rect x="192" y="78" width="17" height="12" rx="2.5" fill="#46a0ff"/>
    <rect x="164" y="73" width="27" height="22" rx="4" fill="#e8ebf2"/>
    <rect x="167" y="76" width="21" height="16" rx="2.5" fill="#aab6c9"/>
  </g>

  <!-- body attitude axes accent -->
  <g stroke-width="4.5" stroke-linecap="round" transform="translate(170 84)">
    <path d="M0 0 L-20 22" stroke="#ff6b6b"/>
    <path d="M0 0 L28 10" stroke="#4ecf7d"/>
    <path d="M0 0 L-4 -30" stroke="#5b9bff"/>
  </g>
</svg>
