[project]
name = "lunalink-adcs"
version = "1.0.0"
description = "LunaLink ADCS simulator: attitude dynamics, control and determination for a Molniya-orbit relay spacecraft (TUM Project X)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "pyvista>=0.48.4",
    "pyvistaqt>=0.11.4",
    "scipy>=1.17.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lunalink = ["data/*.json", "gui/assets/*.svg"]
